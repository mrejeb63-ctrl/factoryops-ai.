
name: Build and Deploy FactoryOps AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract FactoryOps ZIP
        run: |
          mkdir app
          unzip -q FactoryOps_AI_1_0.zip -d app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build application
        working-directory: app
        run: npm run build -- --base=/factoryops-ai/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
